# USB ConfigFS gadget stack
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_HID=y

# FunctionFS configfs function: kernel routes ep0/ep1/ep2 to userspace via
# /dev/ffsX/*. Required by dualsense-ffsd which writes HID descriptors and
# feature-report responses from userspace so DS4Windows and hid-playstation
# accept it as a real DualSense.
#
# In Linux 6.6 the symbol for the LEGACY g_ffs gadget driver
# (drivers/usb/gadget/legacy/g_ffs) is CONFIG_USB_FUNCTIONFS, NOT
# CONFIG_USB_G_FFS (the latter does not exist). USB_FUNCTIONFS selects
# USB_FUNCTIONFS_GENERIC unconditionally, so disabling GENERIC alone is
# impossible. We must disable USB_FUNCTIONFS itself; with it set,
# g_ffs allocates a singleton FFS device at boot, holding the FFS
# namespace, and all mkdir of configfs functions/ffs.* return EBUSY.
# CONFIG_USB_FUNCTIONFS is not set

# CONFIG_USB_F_FS is auto-selected by CONFIG_USB_CONFIGFS_F_FS, no need
# to set it explicitly.
CONFIG_USB_CONFIGFS_F_FS=y

# AM335x MUSB dual-role on USB0 (the mini-USB / OTG port)
CONFIG_USB_MUSB_HDRC=y
CONFIG_USB_MUSB_DUAL_ROLE=y
CONFIG_USB_MUSB_DSPS=y
CONFIG_AM335X_PHY_USB=y
CONFIG_NOP_USB_XCEIV=y

# USB host stack (for the keyboard + mouse on USB1)
CONFIG_USB=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_HID=y

# Input subsystem
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_UINPUT=y
CONFIG_HID=y
CONFIG_HID_GENERIC=y

# Tickless / hi-res timers for low-jitter 1 kHz timerfd
CONFIG_HIGH_RES_TIMERS=y
CONFIG_NO_HZ_IDLE=y

# Default to performance governor so the boot phase doesn't run with
# ondemand ramping under cpufreq's per-load heuristic.
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y


# Boot-time + image-size trims: this is a headless USB-HID gadget
# appliance. The BBB's HDMI display, audio path, wireless and Bluetooth
# (no radio on the rev-A board anyway), and capture-media subsystems
# carry no value here. Dropping them shaves both kernel size (smaller
# decompression at boot) and rootfs size (fewer kernel-module-*
# packages get pulled in by kernel-modules).
#
# All disables are wholesale-subsystem off-switches. If a real need
# surfaces later, re-enable individually.

# No HDMI display -- no DRM stack needed (tilcdc, modesetting helpers).
# CONFIG_DRM is not set

# No audio -- neither HDMI audio nor the McASP TDM lines are used.
# CONFIG_SOUND is not set
# CONFIG_SND is not set

# No wireless on the BBB rev-A. RFKILL is pulled in only by WLAN/BT.
# CONFIG_WIRELESS is not set
# CONFIG_WLAN is not set
# CONFIG_RFKILL is not set
# CONFIG_BT is not set

# No video capture or decode.
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_VIDEO_DEV is not set

# No CAN bus on the BBB user-facing setup.
# CONFIG_CAN is not set

# Kernel-image compression: switch from gzip (the ARM zImage default) to
# LZ4. AM335x Cortex-A8 decompresses LZ4 roughly 2x faster than gzip for
# this image size. Decompression measured at ~3.4 s with gzip; expected
# ~1.5-2 s with LZ4.
# CONFIG_KERNEL_GZIP is not set
CONFIG_HAVE_KERNEL_LZ4=y
CONFIG_KERNEL_LZ4=y
