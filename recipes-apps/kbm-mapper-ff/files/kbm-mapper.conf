# kbm-mapper configuration. Format: simple key=value, # for comments.
# Reload by restarting the service: systemctl restart kbm-mapper.

# --- mouse -> right stick tuning -------------------------------------------

# Sliding velocity window length, in milliseconds. Lower = snappier, higher = smoother.
window_ms=6

# Response curve exponent. 1.0 = linear, 2.0 = quadratic (softer near center).
curve_exp=2.0

# Anti-deadzone: minimum output magnitude on any non-zero input, to push past
# the DualSense's in-game stick deadzone. Range [0, ~0.3].
anti_deadzone=0.10

# Outer saturation: clamp output magnitude (most games saturate near 1.0).
outer_sat=0.97

# Mouse counts/ms that produces full stick deflection. Raise for less sensitive,
# lower for more. Tune for your DPI and game sensitivity.
sens_counts_ms=8.0

# Rotation-debt drain rate per 1ms tick (normalized [0,1]). Higher = faster
# decay of overshoot flicks.
debt_drain=0.05

# --- keyboard mapping ------------------------------------------------------
# Linux KEY_* names (case-insensitive). Action names listed in the README.
key.W=lstick_up
key.S=lstick_down
key.A=lstick_left
key.D=lstick_right
key.SPACE=cross
key.LEFTSHIFT=circle
key.E=triangle
key.Q=square
key.R=r1
key.F=l1
key.ENTER=options
key.TAB=create
key.ESC=ps

# --- mouse button mapping --------------------------------------------------
mouse.LEFT=r2
mouse.RIGHT=l2
mouse.MIDDLE=r3
mouse.SIDE=l3
